services:
  dino-trivia:
    build: .
    container_name: dino-trivia
    restart: unless-stopped
    environment:
      - BIND_ADDR=0.0.0.0:8080
      - WIKI_USER_AGENT=dino-trivia/1.0 (https://dinofacts.fyi; hello@radomski.dev) reqwest/0.12
      # Remove OLLAMA_URL to run heuristic-only (no LLM sidecar needed).
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b-instruct
      # Keep equal to the ollama CPU limit below; more threads than quota get throttled to a crawl.
      - OLLAMA_NUM_THREAD=2
      # Key the rate limiter on the real client behind Cloudflare. Only safe while the origin is reachable
      # solely through Cloudflare (otherwise clients can forge this header); remove it to key on the peer IP.
      - CLIENT_IP_HEADER=CF-Connecting-IP
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dino-facts_default
      - traefik.http.routers.dino-trivia.rule=Host(`dinofacts.fyi`) || Host(`www.dinofacts.fyi`)
      # www → apex, permanent, so there's one canonical address.
      - traefik.http.routers.dino-trivia.middlewares=dino-www-redirect
      - traefik.http.middlewares.dino-www-redirect.redirectregex.regex=^https?://www\.dinofacts\.fyi/(.*)
      - traefik.http.middlewares.dino-www-redirect.redirectregex.replacement=https://dinofacts.fyi/$${1}
      - traefik.http.middlewares.dino-www-redirect.redirectregex.permanent=true
      - traefik.http.routers.dino-trivia.entrypoints=websecure
      - traefik.http.routers.dino-trivia.tls.certresolver=letsencrypt
      - traefik.http.services.dino-trivia.loadbalancer.server.port=8080
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    image: ollama/ollama:latest
    container_name: dino-ollama
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull qwen2.5:3b-instruct
        wait
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

volumes:
  ollama:
