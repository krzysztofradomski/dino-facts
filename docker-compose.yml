services:
  dino-trivia:
    build: .
    container_name: dino-trivia
    restart: unless-stopped
    environment:
      - BIND_ADDR=0.0.0.0:8080
      - WIKI_USER_AGENT=dino-trivia/1.0 (https://dinofacts.fyi; hello@radomski.dev) reqwest/0.12
      # Remove OLLAMA_URL to run heuristic-only (no LLM sidecar needed).
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b-instruct
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    image: ollama/ollama:latest
    container_name: dino-ollama
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull qwen2.5:3b-instruct
        wait
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "3.0"

volumes:
  ollama:
