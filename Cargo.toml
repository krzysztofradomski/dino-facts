[package]
name = "dino-trivia"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
moka = { version = "0.12", features = ["future"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower_governor = "0.6"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
